name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Build
        run: go build -ldflags "-X main.version=dev" -o tokdump .

      - name: Smoke
        run: |
          ./tokdump -h | grep -q 'Usage: tokdump'
          ./tokdump -v | grep -q 'tokdump '
          ./tokdump --version | grep -qx 'tokdump dev'
          echo -n hello | ./tokdump | grep -q '0000000'
